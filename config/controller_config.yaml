controller_manager:
  ros__parameters:
    update_rate: 30  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_base_controller:
      type: diff_drive_controller/DiffDriveController

    gripper_controller:
      type: position_controllers/JointGroupPositionController

# Ordem das juntas igual a do repositorio base do professor (prm_2026), para
# que os comandos de exemplo do enunciado funcionem exatamente como descritos:
#   data[0] = elevacao da haste (gripper_extension), em radianos
#   data[1] = abertura do braco DIREITO (right_gripper_joint), faixa -0.06..0
#   data[2] = abertura do braco ESQUERDO (left_gripper_joint), faixa 0..0.06
# Observacao: a tabela do PDF rotula data[1] como esquerdo e data[2] como
# direito, mas os exemplos de comando do proprio enunciado seguem esta ordem
# (direito, esquerdo), que e a do controller_config do professor.
gripper_controller:
  ros__parameters:
    joints:
      - gripper_extension
      - right_gripper_joint
      - left_gripper_joint

diff_drive_base_controller:
  ros__parameters:
    left_wheel_names: ["drivewhl_l_joint"]
    right_wheel_names: ["drivewhl_r_joint"]

    wheel_separation: 0.4
    #wheels_per_side: 1  # actually 2, but both are controlled by 1 signal
    wheel_radius: 0.1

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 10.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    publish_odom: false         # <--- desativa /odom
    enable_odom_tf: false       # <--- desativa TF odom -> base_link

    open_loop: true 

    cmd_vel_timeout: 0.5
    
    #publish_limited_velocity: true
    use_stamped_vel: false
    #velocity_rolling_window_size: 10

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 0.8
    linear.x.min_velocity: -0.8
    linear.x.max_acceleration: 0.5
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 0.8
    angular.z.min_acceleration: -0.8
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0

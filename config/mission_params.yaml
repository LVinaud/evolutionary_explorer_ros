# ===========================================================================
# Parametros de comportamento da missao (ROS 2).
#
# Estes valores sao carregados pelos nodos no launch (carrega_robo /
# missao.launch.py). Eles espelham os defaults de mission_params.py
# (dataclass MissionParams) e podem ser ajustados SEM recompilar o pacote.
#
# >> Conexao com a FASE 2 (computacao evolutiva): este arquivo e exatamente o
#    "fenotipo" que um otimizador ira gerar a cada individuo/episodio. Basta
#    reescrever os valores abaixo (ou passar outro arquivo via launch) que a
#    maquina de estados passa a se comportar de acordo, sem mudar o codigo.
# ===========================================================================

mission_control:
  ros__parameters:
    # ---- Loop de controle ----
    control_frequency: 20.0
    start_immediately: true

    # ---- EXPLORANDO (varredura em serpentina + vies p/ lado inimigo) ----
    explore_linear_speed: 0.30
    explore_serpentine_gain: 0.4
    explore_serpentine_period: 8.0
    explore_target_heading: 0.0    # rad (0 = +x, rumo a bandeira inimiga)
    explore_heading_kp: 0.5        # ATRACAO p/ o rumo alvo (campo potencial)
    repulse_gain: 2.0              # REPULSAO dos obstaculos (contorna cilindros)
    stuck_window: 6.0              # s p/ detectar travamento
    stuck_min_progress: 0.4        # m: deslocamento minimo na janela
    escape_duration: 2.5           # s de manobra de escape
    escape_turn_speed: 0.9         # rad/s do giro de escape

    # ---- Desvio de obstaculos (LIDAR) ----
    front_sector_half_angle_deg: 35.0
    side_sector_half_angle_deg: 70.0
    obstacle_block_distance: 1.1
    emergency_stop_distance: 0.45
    avoid_linear_speed: 0.10
    avoid_angular_speed: 0.8

    # ---- NAVEGANDO_PARA_BANDEIRA ----
    nav_linear_speed: 0.30
    nav_angular_kp: 1.6
    nav_max_angular_speed: 1.0

    # ---- POSICIONANDO_PARA_COLETA ----
    approach_distance: 1.3       # m: dist. frontal (LIDAR) p/ NAV->POSICIONANDO
    approach_area_ratio: 0.015   # gatilho secundario por area (NAV->POSICIONANDO)
    complete_area_ratio: 0.03    # area da bandeira p/ considerar POSICIONADO (perto)
    target_stop_distance: 0.6    # m: referencia/seguranca
    position_linear_kp: 0.6
    position_angular_kp: 2.0
    centering_tolerance: 0.06

    # ---- Deteccao / transicoes ----
    detect_confirm_frames: 1
    detect_lost_timeout: 3.5
    redetect_spin_speed: 0.7
    redetect_timeout: 8.0

flag_detector:
  ros__parameters:
    # Trabalho 2: deteccao da bandeira inimiga AZUL por COR, na camera RGB
    # comum. O enunciado fornece a mascara RGB 0,73,227 para a bandeira azul.
    #   "color"  -> usa a imagem RGB (image_topic) e uma faixa HSV do azul.
    #   "labels" -> usa /robot_cam/labels_map (camera de segmentacao do T1).
    detection_mode: "color"
    image_topic: "/rgb_cam"

    # Faixa HSV (OpenCV: H 0-179) que isola o azul da bandeira. H~110 e o azul
    # da bandeira; a parede externa (RGB 0,154,114) e esverdeada (H~82) e fica
    # fora desta faixa. Ajuste fino se a iluminacao deslocar a cor.
    hue_min: 100
    hue_max: 130
    sat_min: 80
    val_min: 50

    # Label da bandeira inimiga, usada apenas no modo "labels" (reserva).
    target_label: 25

    # Area minima do blob (contourArea, em px) para considerar a bandeira
    # detectada.
    min_blob_area: 10

    # Publica /flag/debug_image com a deteccao desenhada (depuracao no rqt/RViz).
    publish_debug_image: true
